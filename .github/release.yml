# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Added
      labels:
        - feature
        - model
        - dataset
    - title: Improved
      labels:
        - improvement
        - scoring
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - '*'
